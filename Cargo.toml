[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "FSL-1.1-ALv2"
publish = false

[workspace.dependencies]
# Internal crates (prefix `vbs-` is an internal code name, independent of the product name).
vbs-config = { path = "crates/vbs-config" }
vbs-i18n = { path = "crates/vbs-i18n" }
vbs-core = { path = "crates/vbs-core" }
vbs-evaluation = { path = "crates/vbs-evaluation" }
vbs-license = { path = "crates/vbs-license" }

# External crates. Anything that can open network connections is forbidden
# (checked by scripts/check-offline.mjs and clippy.toml); the collector must
# additionally stay read-only (scripts/check-readonly.mjs).
# OLE compound files (MSI packages; Office documents in phase 3), read through a read-only handle.
cfb = "0.10"
jsonschema = { version = "0.58", default-features = false }
# Management PDF of the evaluation: text with an embedded, subset font (shaping via rustybuzz,
# which also measures text for line breaks) and PNG/JPEG logos. Pure Rust, no network.
krilla = { version = "0.8", default-features = false, features = ["raster-images", "simple-text"] }
lexopt = "0.3"
# Native file dialogs for the evaluation (no Tauri dialog/fs plugins, no frontend permissions).
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
# Technical Excel list of the evaluation (writes .xlsx in memory; pure Rust, no network).
rust_xlsxwriter = { version = "0.99", default-features = false }
rustybuzz = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sys-locale = "0.3"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
windows = { version = "0.62", default-features = false }
windows-sys = "0.61"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Unwinding stays enabled on purpose: the collector catches a panic while
# inspecting one file and reports that file as "not checkable" instead of
# aborting the whole scan.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
