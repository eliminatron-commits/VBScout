name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '24'

jobs:
  checks:
    name: Checks (config, i18n, offline and read-only policy, types)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Central configuration in sync (product.json)
        run: npm run check:config
      - name: Translations complete (i18n check)
        run: npm run check:i18n
      - name: Offline policy (CSP, capabilities, dependencies, sources)
        run: npm run check:offline
      - name: Read-only policy of the collector (with self-test)
        run: npm run check:readonly
      - name: Import check of the program file (self-test)
        run: npm run check:imports
      - name: Svelte / TypeScript
        run: npm run check

  linux:
    name: Linux (development platform) – tests, read-only and network traces
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Build dependencies (WebKitGTK for the app crate), strace
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev \
            libayatana-appindicator3-dev xvfb strace dbus
      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build frontend
        run: npm run build

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests (incl. read-only snapshot test, schema and corpus tests)
        run: cargo test --workspace --locked
      - name: Offline policy (resolved dependency graphs, Windows and Linux)
        run: node scripts/check-offline.mjs --cargo
      - name: Scan performance (100,000 files, limit 10 minutes)
        run: cargo test --release --locked -p vbs-collector --test performance -- --ignored --nocapture

      - name: Build collector (release)
        run: cargo build --release --locked -p vbs-collector
      - name: Read-only trace (strace, collector)
        run: bash scripts/readonly/linux.sh target/release/vbs-collector tests/corpus readonly-out
      - name: Network block test (collector)
        run: |
          bash scripts/nettest/linux.sh nettest-out -- target/release/vbs-collector \
            --path "$PWD/tests/corpus" --out "$PWD/nettest-out/collector-scan.vbscout" --quiet

      - name: Upload trace logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: traces-linux
          path: |
            readonly-out/
            nettest-out/
          if-no-files-found: ignore
          retention-days: 14

  windows:
    name: Windows x64 (${{ matrix.os }}) – build, tests, traces, system test
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        # windows-2025 runs everything; windows-2022 checks the collector on the older server release.
        os: [windows-2025, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build frontend
        run: npm run build

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests (incl. read-only snapshot test, schema and corpus tests)
        run: cargo test --workspace --locked

      - name: Build collector (release, static CRT)
        id: collector
        run: cargo build --release --locked -p vbs-collector
      - name: Build evaluation app (release)
        id: app
        if: matrix.os == 'windows-2025'
        run: npx tauri build --no-bundle

      # The checks below are independent of each other: each runs once its program is built, even
      # if an earlier check failed, so one run reports all of them (the job fails if any fails).
      - name: Collector below 10 MB
        if: ${{ !cancelled() && steps.collector.outcome == 'success' }}
        run: node scripts/check-size.mjs target/release/vbs-collector.exe 10
      - name: Collector imports only Windows system libraries (no C runtime to install, no network)
        if: ${{ !cancelled() && steps.collector.outcome == 'success' }}
        run: node scripts/check-imports.mjs target/release/vbs-collector.exe --out collector-imports.txt
      - name: App program file size (information, limit 20 MB)
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        run: node scripts/check-size.mjs target/release/vbs-app.exe 20
      - name: Scan performance (100,000 files, limit 10 minutes)
        if: ${{ !cancelled() && steps.collector.outcome == 'success' }}
        run: cargo test --release --locked -p vbs-collector --test performance -- --ignored --nocapture

      - name: Read-only trace (ETW, collector)
        if: ${{ !cancelled() && steps.collector.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/readonly/windows.ps1 -Exe target\release\vbs-collector.exe -ScanPath tests\corpus -OutDir readonly-out
      - name: Network block test (collector)
        if: ${{ !cancelled() && steps.collector.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/nettest/windows.ps1 -Exe target\release\vbs-collector.exe -Arguments '--path','tests\corpus','--out','nettest-out\collector-scan.vbscout','--quiet' -OutDir nettest-out

      - name: Without administrator rights the scan is limited and says so
        if: ${{ !cancelled() && steps.collector.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/systemtest/nonadmin.ps1 -Exe target\release\vbs-collector.exe -ScanPath tests\corpus -OutDir nonadmin-out

      - name: System test (dependencies created by Windows itself)
        if: ${{ !cancelled() && steps.collector.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/systemtest/windows.ps1 -Exe target\release\vbs-collector.exe -OutDir systemtest-out

      - name: App starts (smoke test)
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target\release\vbs-app.exe -ArgumentList '--smoke-test=90' -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(150000)) { $p.Kill(); throw 'smoke test timed out' }
          if ($p.ExitCode -ne 0) { throw "smoke test failed with exit code $($p.ExitCode)" }
          'SMOKE OK'
      - name: Network block test (app)
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/nettest/windows.ps1 -Exe target\release\vbs-app.exe -Arguments '--smoke-test=90' -WebView -OutDir nettest-out

      - name: Collector runs without installation (full scan of this machine)
        if: ${{ !cancelled() && steps.collector.outcome == 'success' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force collector-out | Out-Null
          $p = Start-Process -FilePath target\release\vbs-collector.exe -ArgumentList '--out','collector-out' -PassThru -NoNewWindow
          $null = $p.Handle
          if (-not $p.WaitForExit(1800000)) { $p.Kill(); throw 'collector timed out' }
          if ($p.ExitCode -ne 0) { throw "collector failed with exit code $($p.ExitCode)" }
          Get-ChildItem collector-out | Format-Table Name, Length
          # What a real Windows installation contains, and no module failure on it.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $file = Get-ChildItem collector-out | Select-Object -First 1
          $zip = [IO.Compression.ZipFile]::OpenRead($file.FullName)
          $reader = [IO.StreamReader]::new($zip.GetEntry('result.json').Open())
          $json = $reader.ReadToEnd(); $reader.Dispose(); $zip.Dispose()
          Set-Content -LiteralPath collector-out\full-scan-result.json -Value $json -Encoding utf8
          $result = $json | ConvertFrom-Json
          $findings = @($result.findings)
          "findings: $($findings.Count)"
          $findings | Group-Object rule, status | Sort-Object Name | Format-Table Count, Name -AutoSize | Out-String -Width 200
          $result.coverage.sources | Format-Table source, status, reason, entries, inspected, errors, skipped, durationMs -AutoSize | Out-String -Width 200
          # Why items were not checkable (a real machine has locked and protected files; reader errors show as readError).
          $notCheckable = @($findings | Where-Object { $_.status -eq 'notCheckable' })
          $notCheckable | Group-Object rule, kind, reason | Sort-Object Name | Format-Table Count, Name -AutoSize | Out-String -Width 200
          $notCheckable | Group-Object rule, reason | ForEach-Object { $_.Group | Select-Object -First 5 } |
            ForEach-Object { '{0} {1} {2} {3} {4}' -f $_.rule, $_.reason, $_.location.path, $_.details.packagePath, $_.details.readError }
          $internal = @($findings | Where-Object { $_.reason -eq 'internalError' })
          if ($internal.Count) { $internal | ConvertTo-Json -Depth 6; throw "$($internal.Count) internal errors" }
          # Windows' own data under the names of scripts, shortcuts, packages and databases is no finding:
          # differentials and compressed payloads of the component store (also in container image layers),
          # ESE databases of User Access Logging. Anything left is shown with its first bytes.
          $windowsData = @($findings | Where-Object {
            $_.location.path -match '\\WinSxS\\[^\\]+\\[fnr]\\' -or
            ($_.reason -eq 'corrupt' -and $_.location.path -match '\\(WinSxS|LogFiles\\Sum)\\')
          })
          foreach ($finding in $windowsData) {
            $head = ''
            try {
              $stream = [IO.File]::Open($finding.location.path, 'Open', 'Read', 'ReadWrite, Delete')
              try { $bytes = [byte[]]::new(16); $head = [BitConverter]::ToString($bytes, 0, $stream.Read($bytes, 0, 16)) } finally { $stream.Dispose() }
            } catch { $head = $_.Exception.Message }
            '{0} {1} {2}: {3}' -f $finding.rule, $finding.reason, $finding.location.path, $head
          }
          if ($windowsData.Count) { throw "$($windowsData.Count) findings for Windows servicing data or ESE databases" }

      - name: Upload trace logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: traces-${{ matrix.os }}
          path: |
            readonly-out/*.txt
            readonly-out/*.log
            nettest-out/
            nonadmin-out/*.txt
            systemtest-out/
            collector-out/full-scan-result.json
            collector-imports.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload programs (development builds, unsigned)
        if: matrix.os == 'windows-2025'
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-dev
          path: |
            target/release/vbs-collector.exe
            target/release/vbs-app.exe
            collector-out/
          retention-days: 14
